<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タスク管理アプリ</title>
<style>
  :root{--bg:#0f1220;--card:#1a1e33;--line:#2a2f4a;--text:#eef0ff;--muted:#9aa0c3;--accent:#6c7bff;--danger:#ff6b81}
  *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:680px;margin:0 auto;padding:32px 20px 64px}
  h1{font-size:28px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 24px;font-size:14px}
  form{display:flex;gap:8px;margin-bottom:16px}
  input[type=text]{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px}
  button{padding:12px 18px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  .filters{display:flex;gap:8px;margin-bottom:16px}
  .filters button{background:var(--card);color:var(--muted);border:1px solid var(--line);padding:8px 14px}
  .filters button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  li.done .title{text-decoration:line-through;color:var(--muted)}
  .title{flex:1;word-break:break-word}
  .del{background:transparent;color:var(--danger);padding:6px 10px}
  .stats{color:var(--muted);font-size:14px;margin-top:16px}
  .empty{color:var(--muted);text-align:center;padding:32px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>タスク管理</h1>
  <p class="sub">追加・完了・絞り込みができるシンプルなToDoアプリ。データはブラウザに保存されます。</p>
  <form id="addForm">
    <input type="text" id="newTitle" placeholder="新しいタスクを入力…" autocomplete="off">
    <button type="submit">追加</button>
  </form>
  <div class="filters">
    <button data-filter="all" class="active">すべて</button>
    <button data-filter="active">未完了</button>
    <button data-filter="done">完了</button>
  </div>
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>タスクはありません。</p>
  <p class="stats" id="stats"></p>
</div>
<script>
const KEY='task-manager.tasks.v1';
let tasks=JSON.parse(localStorage.getItem(KEY)||'[]');
let filter='all';
const list=document.getElementById('list'), empty=document.getElementById('empty'), stats=document.getElementById('stats');
function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}
function render(){
  const shown=tasks.filter(t=>filter==='all'||(filter==='done')===t.done);
  list.innerHTML='';
  shown.forEach(t=>{
    const li=document.createElement('li'); if(t.done)li.className='done';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=t.done;
    cb.addEventListener('change',()=>{t.done=cb.checked;save();render()});
    const span=document.createElement('span'); span.className='title'; span.textContent=t.title;
    const del=document.createElement('button'); del.className='del'; del.textContent='削除';
    del.addEventListener('click',()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()});
    li.append(cb,span,del); list.appendChild(li);
  });
  empty.hidden=shown.length>0;
  const done=tasks.filter(t=>t.done).length;
  stats.textContent=tasks.length?`全${tasks.length}件 ／ 完了${done}件 ／ 未完了${tasks.length-done}件`:'';
}
document.getElementById('addForm').addEventListener('submit',e=>{
  e.preventDefault();
  const input=document.getElementById('newTitle'); const title=input.value.trim();
  if(!title)return;
  tasks.unshift({id:Date.now(),title,done:false}); input.value=''; save(); render();
});
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{
  filter=b.dataset.filter;
  document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('active',x===b));
  render();
}));
render();
</script>
</body>
</html>
