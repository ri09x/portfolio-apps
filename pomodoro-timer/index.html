<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポモドーロタイマー</title>
<style>
  :root{--bg:#171019;--card:#241a2c;--line:#3a2b47;--text:#f6eefb;--muted:#b8a3c7;--accent:#b06bff;--accent2:#ff6b9d}
  *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:560px;margin:0 auto;padding:32px 20px 64px;text-align:center}
  h1{font-size:28px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 24px;font-size:14px}
  .modes{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
  .modes button{background:var(--card);color:var(--muted);border:1px solid var(--line);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600}
  .modes button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .ring{position:relative;width:260px;height:260px;margin:0 auto 24px}
  svg{transform:rotate(-90deg)}
  .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .time .big{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums}
  .time .label{color:var(--muted);font-size:14px}
  .controls{display:flex;gap:10px;justify-content:center;margin-bottom:28px}
  .controls button{padding:13px 26px;border-radius:12px;border:0;font-weight:700;cursor:pointer;font-size:16px}
  #toggle{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
  #reset{background:var(--card);color:var(--text);border:1px solid var(--line)}
  h2{font-size:18px;text-align:left;margin:0 0 12px}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;text-align:left}
  li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted)}
  .empty{color:var(--muted);font-size:14px;text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <h1>ポモドーロタイマー</h1>
  <p class="sub">集中と休憩を繰り返すタイマー。完了したセッションは記録されます。</p>
  <div class="modes">
    <button data-mode="focus" class="active">集中 25分</button>
    <button data-mode="short">休憩 5分</button>
    <button data-mode="long">長休憩 15分</button>
  </div>
  <div class="ring">
    <svg width="260" height="260">
      <circle cx="130" cy="130" r="118" fill="none" stroke="#3a2b47" stroke-width="12"/>
      <circle id="prog" cx="130" cy="130" r="118" fill="none" stroke="#b06bff" stroke-width="12"
        stroke-linecap="round" stroke-dasharray="741.4" stroke-dashoffset="0"/>
    </svg>
    <div class="time"><div class="big" id="display">25:00</div><div class="label" id="modeLabel">集中</div></div>
  </div>
  <div class="controls">
    <button id="toggle">スタート</button>
    <button id="reset">リセット</button>
  </div>
  <h2>セッション記録</h2>
  <ul id="log"></ul>
  <p class="empty" id="empty">まだ記録がありません。25分の集中を1回終えると、ここに残ります。</p>
</div>
<script>
const DUR={focus:25*60,short:5*60,long:15*60};
const LABEL={focus:'集中',short:'休憩',long:'長休憩'};
const CIRC=741.4, KEY='pomodoro-timer.log.v1';
let mode='focus', total=DUR[mode], remain=total, timer=null;
let log=JSON.parse(localStorage.getItem(KEY)||'[]');
const display=document.getElementById('display'), prog=document.getElementById('prog'),
      toggle=document.getElementById('toggle'), modeLabel=document.getElementById('modeLabel');
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function paint(){
  display.textContent=fmt(remain); modeLabel.textContent=LABEL[mode];
  prog.style.strokeDashoffset=String(CIRC*(1-remain/total));
  document.title=fmt(remain)+' ・ '+LABEL[mode]+' — ポモドーロタイマー';
}
function renderLog(){
  const ul=document.getElementById('log'); ul.innerHTML='';
  log.slice().reverse().forEach(s=>{
    const li=document.createElement('li'); li.textContent=s; ul.appendChild(li);
  });
  document.getElementById('empty').style.display=log.length?'none':'block';
}
function stop(){clearInterval(timer); timer=null; toggle.textContent='スタート'}
function setMode(m){
  stop(); mode=m; total=DUR[m]; remain=total;
  document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  paint();
}
function finish(){
  stop();
  if(mode==='focus'){
    log.push(new Date().toLocaleString('ja-JP')+' に集中セッション（25分）を完了');
    localStorage.setItem(KEY,JSON.stringify(log)); renderLog();
    alert('集中セッション完了！少し休憩しましょう。'); setMode('short');
  }else{
    alert('休憩終了です。'); setMode('focus');
  }
}
toggle.addEventListener('click',()=>{
  if(timer){stop(); return}
  toggle.textContent='一時停止';
  timer=setInterval(()=>{ remain--; paint(); if(remain<=0)finish(); },1000);
});
document.getElementById('reset').addEventListener('click',()=>setMode(mode));
document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
paint(); renderLog();
</script>
</body>
</html>
